# Eduly — Mac'siz iOS TestFlight (Codemagic). App Store'a Submit YOK.
#
# Secrets group `appstore_credentials`:
#   APP_STORE_CONNECT_ISSUER_ID       = 9ea68bff-0cc0-4875-82b9-794881555f4c
#   APP_STORE_CONNECT_KEY_IDENTIFIER = 3D7L4VWB3L
#   APP_STORE_CONNECT_PRIVATE_KEY    = AuthKey_3D7L4VWB3L.p8 (tam içerik)
#   APPLE_TEAM_ID                    = developer.apple.com → Membership (10 karakter)

workflows:
  ios-testflight:
    name: Eduly iOS → TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - appstore_credentials
      vars:
        XCODE_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
        BUNDLE_ID: com.eduly.mobile
    scripts:
      - name: Flutter pub get
        script: flutter pub get
      - name: CocoaPods
        script: cd ios && pod install
      - name: Analyze + test
        script: |
          flutter analyze
          flutter test
      - name: Build signed IPA
        script: |
          flutter build ipa --release \
            --build-name=1.0.1 \
            --build-number=${PROJECT_BUILD_NUMBER:-$BUILD_NUMBER}
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        # submit_to_app_store: false  — yayınlama yok

# Eduly — Mac'siz iOS TestFlight (Codemagic M2) + Android Play Store CI
#
# iOS Secrets group `appstore_credentials`:
#   APP_STORE_CONNECT_ISSUER_ID
#   APP_STORE_CONNECT_KEY_IDENTIFIER
#   APP_STORE_CONNECT_PRIVATE_KEY
#   APPLE_TEAM_ID
#   CERTIFICATE_PRIVATE_KEY
#
# Android Secrets group `google_play_credentials` (opsiyonel, imzalı AAB için):
#   CM_KEYSTORE            (base64 kodlu upload-keystore.jks)
#   CM_KEYSTORE_PASSWORD
#   CM_KEY_PASSWORD
#   CM_KEY_ALIAS

workflows:
  ios-testflight:
    name: Eduly iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: 'eduly-testflight'
          include: true
          source: true
      tag_patterns:
        - pattern: 'v*'
          include: true
      cancel_previous_builds: true
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - appstore_credentials
      vars:
        BUNDLE_ID: com.eduly.mobile
        APP_STORE_APPLE_ID: "6813570990"
        BUILD_NAME: "1.0.2"
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: Set up keychain
        script: |
          keychain initialize
      - name: Fetch signing files from App Store Connect
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Add certificates to keychain
        script: |
          keychain add-certificates
      - name: Set up code signing on Xcode project
        script: |
          xcode-project use-profiles
      - name: Flutter dependencies & CocoaPods
        script: |
          flutter config --no-enable-swift-package-manager
          flutter pub get
          cd ios
          pod install || pod install --repo-update
      - name: Analyze & test
        script: |
          flutter analyze
          flutter test
      - name: Build signed IPA
        script: |
          PUBSPEC_LINE=$(grep '^version:' pubspec.yaml | awk '{print $2}' | tr -d '\r')
          PUBSPEC_VERSION=$(echo "$PUBSPEC_LINE" | cut -d'+' -f1)
          PUBSPEC_BUILD=$(echo "$PUBSPEC_LINE" | cut -d'+' -f2)
          EFFECTIVE_BUILD_NAME="${PUBSPEC_VERSION:-$BUILD_NAME}"
          if ! [[ "$PUBSPEC_BUILD" =~ ^[0-9]+$ ]]; then
            PUBSPEC_BUILD=7
          fi
          LATEST_BUILD=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || true)
          if ! [[ "$LATEST_BUILD" =~ ^[0-9]+$ ]]; then
            LATEST_BUILD=6
          fi
          NEXT_BUILD=$((LATEST_BUILD + 1))
          if [ "$NEXT_BUILD" -lt "$PUBSPEC_BUILD" ]; then
            NEXT_BUILD="$PUBSPEC_BUILD"
          fi
          echo "Building iOS $EFFECTIVE_BUILD_NAME ($NEXT_BUILD)..."
          flutter build ipa --release \
            --build-name="$EFFECTIVE_BUILD_NAME" \
            --build-number="$NEXT_BUILD" \
            --export-options-plist=/Users/builder/export_options.plist
      - name: Upload iOS dSYMs to Crashlytics (non-blocking)
        script: |
          DSYM_PATH="build/ios/archive/Runner.xcarchive/dSYMs/Runner.app.dSYM"
          UPLOAD_BIN="ios/Pods/FirebaseCrashlytics/upload-symbols"
          if [ -x "$UPLOAD_BIN" ] && [ -d "$DSYM_PATH" ]; then
            "$UPLOAD_BIN" -gsp ios/Runner/GoogleService-Info.plist -p ios "$DSYM_PATH" || true
          else
            echo "Crashlytics dSYM upload skipped (binary or dSYM not found)."
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false

  android-playstore:
    name: Eduly Android → AAB (Linux)
    max_build_duration: 45
    instance_type: linux_x2
    environment:
      flutter: stable
      java: 17
      groups:
        - google_play_credentials
      vars:
        BUILD_NAME: "1.0.2"
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/.gradle/caches
    scripts:
      - name: Decode Android keystore
        script: |
          if [ -z "${CM_KEYSTORE:-}" ]; then
            echo "CM_KEYSTORE bulunamadı. google_play_credentials grubunu yapılandırın."
            exit 1
          fi
          echo "$CM_KEYSTORE" | base64 --decode > android/upload-keystore.jks
          cat <<EOF > android/key.properties
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=../upload-keystore.jks
          EOF
      - name: Flutter pub get, analyze & test
        script: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Build signed App Bundle (AAB)
        script: |
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1 | tr -d '\r')
          EFFECTIVE_BUILD_NAME="${PUBSPEC_VERSION:-$BUILD_NAME}"
          BUILD_NO="${PROJECT_BUILD_NUMBER:-7}"
          flutter build appbundle --release \
            --build-name="$EFFECTIVE_BUILD_NAME" \
            --build-number="$BUILD_NO"
    artifacts:
      - build/app/outputs/bundle/release/*.aab

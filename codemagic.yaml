# Eduly — Mac'siz iOS TestFlight (Codemagic). App Store Submit YOK.
#
# Secrets group `appstore_credentials`:
#   APP_STORE_CONNECT_ISSUER_ID
#   APP_STORE_CONNECT_KEY_IDENTIFIER
#   APP_STORE_CONNECT_PRIVATE_KEY
#   APPLE_TEAM_ID
#   CERTIFICATE_PRIVATE_KEY   (RSA PEM — Distribution cert oluşturmak için)

workflows:
  ios-testflight:
    name: Eduly iOS → TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - appstore_credentials
      vars:
        BUNDLE_ID: com.eduly.mobile
        APP_STORE_APPLE_ID: "6813570990"
    scripts:
      - name: Set up keychain
        script: |
          keychain initialize
      - name: Fetch signing files from App Store Connect
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Add certificates to keychain
        script: |
          keychain add-certificates
      - name: Set up code signing on Xcode project
        script: |
          xcode-project use-profiles
      - name: Flutter pub get
        script: |
          flutter config --no-enable-swift-package-manager
          flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          cd ios
          rm -f Podfile.lock
          pod install --repo-update
      - name: Analyze + test
        script: |
          flutter analyze
          flutter test
      - name: Build signed IPA
        script: |
          BUILD_NO="${PROJECT_BUILD_NUMBER:-$BUILD_NUMBER}"
          flutter config --no-enable-swift-package-manager
          cd ios && pod install && cd ..
          flutter build ipa --release \
            --build-name=1.0.1 \
            --build-number="$BUILD_NO" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        # submit_to_app_store: false — yayınlama yok
